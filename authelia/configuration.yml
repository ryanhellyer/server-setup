# =============================================================================
# Authelia configuration — forward-auth gate for protected vhosts.
#
# Mounted read-only at /config. The SQLite database, the user database and the
# filesystem notifier all live in /data (host: ~/www/auth.hellyer.kiwi), so the
# nightly ~/www backup snapshots them like a site. Note /data is a DATA dir, not
# an nginx site root — the portal is a proxy vhost (nginx/conf.d/auth-site.conf).
#
# SECRETS ARE NOT IN THIS FILE. They are supplied as native Authelia
# environment variables (see compose.yaml):
#   AUTHELIA_SESSION_SECRET
#   AUTHELIA_STORAGE_ENCRYPTION_KEY
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
# plus AUTHELIA_SESSION_REDIS_HOST / _PORT. Secrets ending in key/secret/
# password/token can also use the *_FILE variant; see
# https://www.authelia.com/c/secrets.
#
# nginx calls this container per-request via auth_request. See
# nginx/snippets/authelia-authz-location.conf + authelia-authrequest.conf and
# nginx/conf.d/auth-site.conf (the login portal).
# =============================================================================

---
theme: 'auto'

server:
  host: '0.0.0.0'
  port: 9091
  path: ''
  read_buffer_size: 4096
  write_buffer_size: 4096
  enable_pprof: false
  enable_expvars: false
  disable_healthcheck: false
  # Brand the portal: override the built-in logo.png and favicon.ico. Authelia
  # 4.39 supports ONLY these two image overrides (plus locale JSON) — there is
  # no custom-CSS hook, so theme.css is injected by nginx instead
  # (nginx/conf.d/auth-site.conf) and served same-origin from /themes/.
  asset_path: '/config/assets'
  endpoints:
    authz:
      # nginx's auth_request uses the AuthRequest implementation.
      auth-request:
        implementation: 'AuthRequest'

log:
  level: 'info'
  format: 'text'

totp:
  disable: false
  issuer: 'hellyer.kiwi'
  period: 30
  skew: 1

authentication_backend:
  # No SMTP notifier here, so password reset stays off.
  password_reset:
    disable: true
  refresh_interval: '5m'
  file:
    # Generated by scripts/provision-authelia.sh from AUTHELIA_ADMIN_* in .env.
    path: '/data/users_database.yml'
    watch: true
    search:
      email: false
      case_insensitive: true
    password:
      algorithm: 'argon2id'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  # Deny by default: a vhost is protected only when nginx asks Authelia about
  # it AND a rule below grants access. Add future protected hosts here.
  #
  # All protected hosts share the single `ryan` user (and the hellyer.kiwi
  # session cookie), so one login covers them all. `two_factor` requires a
  # TOTP device to have been registered (see scripts/authelia-notify-code.sh
  # for enrollment on boxes with no mail server).
  #
  # To add a host: add it here AND include the two authelia snippets in that
  # host's nginx server block (see nginx/sites/README.md).
  #
  # Rules are first-match, so narrower resource rules MUST precede the broad
  # domain rule below.
  default_policy: 'deny'
  rules:
    # ryan.hellyer.kiwi's Laravel app fetches this read-only snapshot
    # server-side (config/wordpress.php). It must NOT require SSO: an
    # unauthenticated request would otherwise be bounced to the login portal,
    # the app would receive HTML instead of JSON, and every page (including
    # 404s) would 500. Scope is deliberately tight — only the published
    # posts/tags endpoint the app uses. wp-admin and the rest of /wp-json stay
    # behind two_factor via the rule below.
    - domain: 'admin.ryan.hellyer.kiwi'
      resources:
        - '^/wp-json/wordpress-api/v1/posts/?$'
      policy: 'bypass'

    - domain:
        - 'chat.hellyer.kiwi'
        - 'storage.hellyer.kiwi'
        - 'invoices.hellyer.kiwi'
        - 'admin.ryan.hellyer.kiwi'
        - 'health.hellyer.kiwi'
        - 'secure.hellyer.kiwi'
        - 'dad.hellyer.kiwi'
      policy: 'two_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  expiration: '1M'
  inactivity: '1M'
  remember_me: '1M'
  cookies:
    # Cookie scoped to the whole hellyer.kiwi domain so the portal session is
    # presented when nginx asks about chat.hellyer.kiwi.
    #
    # IMPORTANT: when a `cookies` list is used, default_redirection_url MUST be
    # set per-cookie — a GLOBAL default_redirection_url makes Authelia refuse to
    # start ("session: option 'cookies' must be configured with the per cookie
    # option 'default_redirection_url' but the global one is configured"). So
    # this file intentionally has no global default_redirection_url.
    - domain: 'hellyer.kiwi'
      authelia_url: 'https://auth.hellyer.kiwi'
      default_redirection_url: 'https://chat.hellyer.kiwi'
  redis:
    host: 'valkey'
    port: 6379
    database_index: 0
    maximum_active_connections: 8
    minimum_idle_connections: 0

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  disable_startup_check: false
  filesystem:
    filename: '/data/notification.txt'

identity_validation:
  reset_password:
    jwt_lifespan: '5m'
    jwt_algorithm: 'HS256'
