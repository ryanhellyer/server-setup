<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in temporarily unavailable</title>
<style>
	:root {
		--accent: #fc364d;
		--primary: #d32f3f;
		--ink: #18181b;
		--body: #3f3f46;
		--line: #e4e4e7;
		--panel: #fafafa;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--panel);
		color: var(--body);
		font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
		padding: 2rem;
	}
	.card {
		background: #fff;
		border: 1px solid var(--line);
		border-radius: 1.5rem;
		padding: 2.5rem;
		max-width: 30rem;
		text-align: center;
		box-shadow: 0 8px 25px -8px rgba(24, 24, 27, 0.12);
	}
	h1 { color: var(--ink); font-size: 1.5rem; margin: 0 0 1rem; }
	p { margin: 0 0 1.5rem; }
	a.button {
		display: inline-block;
		padding: 0.75rem 2rem;
		background: var(--primary);
		color: #fff;
		border: 2px solid var(--primary);
		border-radius: 99rem;
		font-weight: 600;
		text-decoration: none;
	}
	a.button:hover { background: #fff; color: var(--primary); }
</style>
</head>
<body>
	<div class="card">
		<h1>Sign-in temporarily unavailable</h1>
		<p>The sign-in service isn't responding right now. This is usually brief — please try again in a moment.</p>
		<a class="button" href="/">Retry</a>
	</div>
</body>
</html>
