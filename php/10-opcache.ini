; OPcache is statically compiled into PHP 8.5 (sury) — there is no
; php8.5-opcache package and no opcache.so to load. The [opcache] section
; below is enough to enable it.
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Revalidate file mtimes every 10s, so edits to PHP files on the host (~/www)
; become visible within ~10 seconds without reloading FPM. Set
; revalidate_freq = 0 to check on every request, or validate_timestamps = 0 for
; maximum performance — but then edits need php-reload/restart to take effect.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
opcache.jit = 1255
opcache.jit_buffer_size = 64M