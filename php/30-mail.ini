; mailrelay shim (EMAILS.md). Every PHP mail() call is handed to
; /usr/sbin/sendmail, which msmtp-mta provides as a relay to the mailrelay
; container -> Telegram. No per-site configuration needed.
;
; sendmail_path is PHP's compiled default; set explicitly so the chain is
; obvious. sendmail_from gives mail() a From when the application doesn't set
; one (the mailrelay display still shows any application-supplied From header).
[mail]
sendmail_path = /usr/sbin/sendmail -t -i
sendmail_from = server@hellyer.kiwi
