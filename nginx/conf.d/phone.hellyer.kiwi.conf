# =============================================================================
# phone.hellyer.kiwi — Laravel site behind Authelia.
#
# The web root is public/ (the Laravel app is installed into
# ~/www/phone.hellyer.kiwi/ later). The phone-sync content is NOT served here:
# it lives outside the web root (host ~/phone-files, an sshfs mount of
# u676107:/home/phone-files) and is mounted read-only into the php-fpm
# container at /var/phone-files, so the Laravel app reads it directly.
#
# Standalone block because auth_request is not variable-driven (see
# nginx/sites/README.md). Also requires phone.hellyer.kiwi in the
# access_control rule in authelia/configuration.yml.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name phone.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/phone.hellyer.kiwi/public;
	index index.php index.html;

	access_log /var/log/sites/phone.hellyer.kiwi/access.log;
	error_log /var/log/sites/phone.hellyer.kiwi/error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

	# Authelia forward-auth gate (whole vhost). The authz location must be
	# included once per server block, before the request include.
	include /etc/nginx/snippets/authelia-authz-location.conf;
	include /etc/nginx/snippets/authelia-authrequest.conf;

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	# ---- Laravel front controller ----
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		fastcgi_cache_bypass $no_cache_final;
		fastcgi_no_cache     $no_cache_final;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
		fastcgi_cache_use_stale error timeout invalid_header http_500;
	}
}
