# =============================================================================
# auth.hellyer.kiwi — Authelia login / 2FA portal.
#
# This is the host users are redirected to when a protected vhost (e.g.
# chat.hellyer.kiwi) returns 401. It is deliberately NOT itself protected.
#
# Proxied to the `authelia` container on the compose `web` network. The target
# is a VARIABLE ($authelia_upstream), resolved at request time via the
# http-level resolver, so nginx still boots if authelia is down/missing.
# The session cookie is scoped to hellyer.kiwi (authelia/configuration.yml),
# which is how logging in here authorises chat.hellyer.kiwi.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name auth.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	# Scheme lives in the variable (same style as the authz snippet), so the
	# proxy_pass directive uses the bare variable — NOT "http://$var", which
	# would double the scheme and fail with "invalid port in upstream".
	set $authelia_upstream "http://authelia:9091";

	client_max_body_size 10m;

	access_log /var/log/nginx/auth-site.access.log;
	error_log /var/log/nginx/auth-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		proxy_pass $authelia_upstream;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
