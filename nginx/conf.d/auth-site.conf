# =============================================================================
# auth.hellyer.kiwi — Authelia login / 2FA portal.
#
# This is the host users are redirected to when a protected vhost (e.g.
# chat.hellyer.kiwi) returns 401. It is deliberately NOT itself protected.
#
# Proxied to the `authelia` container on the compose `web` network. The target
# is a VARIABLE ($authelia_upstream), resolved at request time via the
# http-level resolver, so nginx still boots if authelia is down/missing.
# The session cookie is scoped to hellyer.kiwi (authelia/configuration.yml),
# which is how logging in here authorises chat.hellyer.kiwi.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name auth.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	# Scheme lives in the variable (same style as the authz snippet), so the
	# proxy_pass directive uses the bare variable — NOT "http://$var", which
	# would double the scheme and fail with "invalid port in upstream".
	set $authelia_upstream "http://authelia:9091";

	client_max_body_size 10m;

	access_log /var/log/nginx/auth-site.access.log;
	error_log /var/log/nginx/auth-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	# ---- Custom theme assets (logo handled by Authelia's asset_path; CSS is
	# injected below). Served same-origin from the nginx container, so the
	# default Authelia CSP (`default-src 'self'`) already permits them.
	location /themes/ {
		alias /var/www/auth.hellyer.kiwi/themes/;
		access_log off;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ---- Upstream failures ----------------------------------------------------
	# If Authelia is down, intercept the 502/503/504 and serve a static error
	# page. This is declared OUTSIDE `location /`, so the sub_filter below does
	# NOT rewrite it — otherwise the injected <link> would end up inside nginx's
	# own error page.
	proxy_intercept_errors on;
	error_page 502 503 504 = /_authelia_error.html;

	location = /_authelia_error.html {
		internal;
		root /var/www/auth.hellyer.kiwi/errors;
		add_header Retry-After 30 always;
		add_header Cache-Control "no-store" always;
	}

	location / {
		proxy_pass $authelia_upstream;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		# Authelia has no custom-CSS hook in 4.39, so inject a stylesheet link
		# into the portal HTML. The stylesheet + font are served same-origin
		# from /themes/ above.
		#
		# Accept-Encoding is cleared so the upstream reply is plain text the
		# filter can rewrite (sub_filter cannot see inside gzip). sub_filter_once
		# limits the rewrite to the first match. text/html is the default type.
		proxy_set_header Accept-Encoding "";

		sub_filter_once on;
		sub_filter '</head>' '<link rel="stylesheet" href="/themes/rh-theme.css"></head>';
	}
}
