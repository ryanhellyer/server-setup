# =============================================================================
# dad.hellyer.kiwi — static site, split out of the shared static-site block so
# it can be protected by Authelia. This REPLACES the previous HTTP basic auth
# (.htpasswd) on this host.
#
# auth_request is not variable-driven, so a protected host cannot share a
# server block with unprotected ones — hence its own small block.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name dad.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/dad.hellyer.kiwi/public;
	index index.html index.php;
	autoindex on;

	access_log /var/log/sites/dad.hellyer.kiwi/access.log;
	error_log /var/log/sites/dad.hellyer.kiwi/error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

	# Authelia forward-auth gate (whole vhost) — replaces auth_basic.
	include /etc/nginx/snippets/authelia-authz-location.conf;
	include /etc/nginx/snippets/authelia-authrequest.conf;

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ =404;
	}
}
