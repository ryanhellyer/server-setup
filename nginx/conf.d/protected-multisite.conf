# =============================================================================
# Protected WordPress multisite hosts — invoices.hellyer.kiwi and
# admin.ryan.hellyer.kiwi. Split out of the shared wordpress-multisite block
# because they are behind Authelia, and auth_request cannot be variable-driven
# (so protected hosts cannot share a server block with unprotected ones).
#
# Same pressabl root + WordPress locations as the main multisite block.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		invoices.hellyer.kiwi
		admin.ryan.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/pressabl/public_html;
	index index.php;

	access_log /var/log/sites/pressabl/access.log;
	error_log /var/log/sites/pressabl/error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

	# Authelia forward-auth gate (whole vhost).
	include /etc/nginx/snippets/authelia-authz-location.conf;
	include /etc/nginx/snippets/authelia-authrequest.conf;

	# Multisite-specific locations (files/, blogs.dir, .git).
	include /etc/nginx/snippets/wordpress-locations.conf;

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		fastcgi_cache_bypass $no_cache_final;
		fastcgi_no_cache     $no_cache_final;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
		fastcgi_cache_use_stale error timeout invalid_header http_500;
	}
}
