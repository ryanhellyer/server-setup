# =============================================================================
# Port 80 — ONE catch-all block for every domain.
#   - serves Let's Encrypt http01 challenges from the ACME webroot, and
#   - redirects everything else to HTTPS.
#
# This single block replaces the old per-domain port-80 blocks.
# =============================================================================

server {
	listen 80;
	listen [::]:80;
	server_name _;

	location ~ /.well-known/acme-challenge/ {
		allow all;
		root /var/www/acme;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}