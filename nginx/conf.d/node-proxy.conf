# =============================================================================
# Open WebUI proxy — chat.hellyer.kiwi (WebSockets + long AI streams).
#
# Proxies to the `open-webui` container on the compose `web` network. The target
# is a VARIABLE ($open_webui_upstream, set in nginx.conf), which makes nginx
# resolve it at request time via the shared resolver — so nginx still starts if
# open-webui is down/missing (a static upstream would make it crash-loop and
# take every other site with it). The data lives in ~/www/chat.hellyer.kiwi on
# the host; see scripts/provision-openwebui.sh.
# To add another proxied app: its own server block + upstream/port.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		chat.hellyer.kiwi
		# >>> new-site.sh: add node-proxy domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	# Resolve open-webui at request time (not startup) via the http-level
	# resolver, so nginx starts even if open-webui is down or missing.
	set $open_webui_upstream "open-webui:8080";

	client_max_body_size 100M;

	access_log /var/log/nginx/node-proxy.access.log;
	error_log /var/log/nginx/node-proxy.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		proxy_pass http://$open_webui_upstream;

		# Standard proxy headers.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support for real-time streaming.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		# Long timeouts for AI responses.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_connect_timeout 300s;
	}
}