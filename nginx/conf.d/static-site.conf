# =============================================================================
# Static file sites — ONE server block for chocolate, julia, stuff, mum & dad.
#
#   chocolate.hellyer.kiwi  /var/www/chocolate.hellyer.kiwi/public        (autoindex)
#   julia.hellyer.kiwi      /var/www/julia.hellyer.kiwi/public            (autoindex)
#   stuff.hellyer.kiwi      /var/www/stuff.hellyer.kiwi/public_html       (autoindex + protected paths)
#   mum.hellyer.kiwi        /var/www/mum.hellyer.kiwi/public
#   dad.hellyer.kiwi        /var/www/dad.hellyer.kiwi/public              (basic auth)
#
# Note: autoindex cannot be driven by a variable in nginx, so directory
# listing is on for the whole block (a small behaviour change for mum/dad).
# dad's whole-site auth is switched per-host via the $static_auth_realm map.
# =============================================================================

map $http_host $static_root {
	hostnames;
	chocolate.hellyer.kiwi /var/www/chocolate.hellyer.kiwi/public;
	julia.hellyer.kiwi     /var/www/julia.hellyer.kiwi/public;
	stuff.hellyer.kiwi     /var/www/stuff.hellyer.kiwi/public_html;
	mum.hellyer.kiwi       /var/www/mum.hellyer.kiwi/public;
	dad.hellyer.kiwi       /var/www/dad.hellyer.kiwi/public;
}

# "off" disables auth for non-protected hosts (auth_basic accepts a variable).
map $http_host $static_auth_realm {
	hostnames;
	default "off";
	dad.hellyer.kiwi "Restricted Access";
}

map $http_host $static_auth_file {
	hostnames;
	default /var/www/.htpasswd-none;
	dad.hellyer.kiwi /var/www/dad.hellyer.kiwi/.htpasswd;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		chocolate.hellyer.kiwi julia.hellyer.kiwi stuff.hellyer.kiwi mum.hellyer.kiwi dad.hellyer.kiwi
		# >>> new-site.sh: add static-site domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root $static_root;
	index index.html index.php;
	autoindex on;

	auth_basic $static_auth_realm;
	auth_basic_user_file $static_auth_file;

	access_log /var/log/nginx/static-site.access.log;
	error_log /var/log/nginx/static-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ =404;
	}

	# ---- stuff.hellyer.kiwi protected paths (username/password = luna) ----
	location /Luna/medical-records {
		auth_basic "Restricted Access";
		auth_basic_user_file /var/www/stuff.hellyer.kiwi/public_html/Luna/medical-records/.htpasswd;
		autoindex on;
	}
	location /cvs/non-public {
		auth_basic "Restricted Access";
		auth_basic_user_file /var/www/stuff.hellyer.kiwi/.htpasswd;
	}
	location /cvs/old-cvs-httpwd {
		auth_basic "Restricted Access";
		auth_basic_user_file /var/www/stuff.hellyer.kiwi/.htpasswd;
	}
	location /medical-records {
		auth_basic "Restricted Access";
		auth_basic_user_file /var/www/stuff.hellyer.kiwi/.htpasswd;
	}
	location /private {
		auth_basic "Restricted Access";
		auth_basic_user_file /var/www/stuff.hellyer.kiwi/.htpasswd;
	}
}