# =============================================================================
# PHP-FPM sites — ONE server block for every Laravel / generic-PHP site.
#
# All of them share the single `pressabl` certificate (issued by
# scripts/certbot-issue.sh from certbot/domains.txt; see certbot/README.md).
#
# Per-site differences are handled entirely by the maps below, so most site
# changes are a single-line edit. To change PHP socket/version for ALL sites
# at once, edit the `php-fpm` upstream in nginx.conf.
#
# To add a site: add it to $site_root + $site_access_log + the server_name
# list (scripts/new-site.sh automates this).
# =============================================================================

map $http_host $site_root {
	hostnames;
	secure.hellyer.kiwi    /var/www/secure.hellyer.kiwi/public;
	ryan.hellyer.kiwi      /var/www/ryan.hellyer.kiwi/public;
	gpx.hellyer.kiwi       /var/www/gpx.hellyer.kiwi/public;
	spam-destroyer.com     /var/www/spam-destroyer.com/public;
	kartastrophecup.de     /var/www/kartastrophecup.de/public;
	german.hellyer.kiwi    /var/www/german.hellyer.kiwi/public;
	cvs.hellyer.kiwi       /var/www/cvs.hellyer.kiwi/public;
	ai.hellyer.kiwi        /var/www/ai.hellyer.kiwi/public;
	health.hellyer.kiwi    /var/www/health.hellyer.kiwi/public;
	instantattend.com      /var/www/instantattend.com/public;
}

map $http_host $site_access_log {
	hostnames;
	default /var/log/nginx/php-site.access.log;
	secure.hellyer.kiwi    /var/log/sites/secure.hellyer.kiwi/access.log;
	ryan.hellyer.kiwi      /var/log/sites/ryan.hellyer.kiwi/access.log;
	gpx.hellyer.kiwi       /var/log/sites/gpx.hellyer.kiwi/access.log;
	spam-destroyer.com     /var/log/sites/spam-destroyer.com/access.log;
	kartastrophecup.de     /var/log/sites/kartastrophecup.de/access.log;
	german.hellyer.kiwi    /var/log/sites/german.hellyer.kiwi/access.log;
	cvs.hellyer.kiwi       /var/log/sites/cvs.hellyer.kiwi/access.log;
	ai.hellyer.kiwi        /var/log/sites/ai.hellyer.kiwi/access.log;
	health.hellyer.kiwi    /var/log/sites/health.hellyer.kiwi/access.log;
	instantattend.com      /var/log/sites/instantattend.com/access.log;
}

# german.hellyer.kiwi intentionally 404s unknown paths instead of routing
# them through the PHP front controller.
map $http_host $site_try_files {
	hostnames;
	default /index.php?$args;
	german.hellyer.kiwi    =404;
}

# ryan-specific extras (scope the shared locations below to ryan only, so
# they never affect the other sites served by this block).
map $http_host $ryan_extra {
	hostnames;
	default 0;
	ryan.hellyer.kiwi 1;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		gpx.hellyer.kiwi ryan.hellyer.kiwi kartastrophecup.de spam-destroyer.com
		spam-destroyer.hellyer.kiwi
		german.hellyer.kiwi cvs.hellyer.kiwi ai.hellyer.kiwi health.hellyer.kiwi
		instantattend.com
		# >>> new-site.sh: add php-site domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root $site_root;
	index index.php index.html;

	access_log $site_access_log;
	error_log /var/log/nginx/php-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	# ---- ryan.hellyer.kiwi: redirect .jpg/.webp to .avif ----
	# (For every other site this location falls through to plain static
	# serving so the other domains in this block are unaffected.)
	location ~* \.(jpg|webp)$ {
		if ($ryan_extra) { rewrite ^(.+)\.(jpg|webp)$ $1.avif permanent; }

		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
		log_not_found off;
		include /etc/nginx/snippets/security-headers.conf;
	}

	# ---- serve /files/ directly, else route through the front controller ----
	# (Matches the original behaviour of every site in this block.)
	location ~ ^/files/ {
		try_files $uri $uri/ @files_fallback;
	}
	location @files_fallback {
		rewrite ^ /index.php last;
	}

	# ---- ryan.hellyer.kiwi: redirect year archive paths to the homepage ----
	location ~ "^/\d{4}/$" {
		if ($ryan_extra) { return 301 /; }

		try_files $uri $uri/ $site_try_files;
	}

	# ---- ryan.hellyer.kiwi: Bluesky DID verification ----
	location = /.well-known/atproto-did {
		add_header Content-Type text/plain;
		if ($ryan_extra) { return 200 'did:plc:an43kfun7fbgelqglo3xduyd'; }
	}

	# ---- security: never execute PHP under /images/ ----
	location ~* ^/images/.*\.php$ { return 403; }

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ $site_try_files;
	}

	location ~ \.php$ {
		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		# Shared cache bypass (WP cookies, admin paths, logged-in sessions)
		# OR the per-site kill switch (kartastrophecup.de).
		fastcgi_cache_bypass $no_cache_final $site_no_cache;
		fastcgi_no_cache     $no_cache_final $site_no_cache;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
		fastcgi_cache_use_stale error timeout invalid_header http_500;
	}
}
