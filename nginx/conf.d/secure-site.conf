# =============================================================================
# secure.hellyer.kiwi — basic-auth'd site with fallback to the WordPress
# multisite. Too different from the other blocks to join, but still reuses
# the shared PHP + security snippets.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name secure.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	# Entire block is behind HTTP basic auth.
	auth_basic "Restricted Access";
	auth_basic_user_file /var/www/secure-new/.htpasswd;

	root /var/www/secure-new/public;
	index index.html index.php;

	access_log /var/log/sites/secure-new/access.log;
	error_log /var/log/sites/secure-new/error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		try_files $uri $uri/ @fallback;
	}

	# If nothing is found, fall back to the Pressabl WordPress install.
	location @fallback {
		root /var/www/pressabl/public_html;
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		root /var/www/secure-new/public;

		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		fastcgi_cache_bypass $no_cache_final;
		fastcgi_no_cache     $no_cache_final;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
		fastcgi_cache_use_stale error timeout invalid_header http_500;
	}
}