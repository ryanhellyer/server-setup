# =============================================================================
# health.hellyer.kiwi — a single PHP site, split out of the shared php-site
# block so it can be protected by Authelia. (auth_request is not variable-
# driven, so a protected host cannot live in a shared server block alongside
# unprotected ones — each protected host gets its own small block.)
#
# Scoped copy of the php-site config: same snippets, upstream and cache.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name health.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/health.hellyer.kiwi/public;
	index index.php index.html;

	access_log /var/log/sites/health.hellyer.kiwi/access.log;
	error_log /var/log/sites/health.hellyer.kiwi/error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	# Authelia forward-auth gate (whole vhost). The authz location must be
	# included once per server block, before the request include.
	include /etc/nginx/snippets/authelia-authz-location.conf;
	include /etc/nginx/snippets/authelia-authrequest.conf;

	# ---- serve /files/ directly, else route through the front controller ----
	location ~ ^/files/ {
		try_files $uri $uri/ @files_fallback;
	}
	location @files_fallback {
		rewrite ^ /index.php last;
	}

	# ---- security: never execute PHP under /images/ ----
	location ~* ^/images/.*\.php$ { return 403; }

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		fastcgi_cache_bypass $no_cache_final;
		fastcgi_no_cache     $no_cache_final;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
		fastcgi_cache_use_stale error timeout invalid_header http_500;
	}
}
