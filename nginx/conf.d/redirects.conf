# =============================================================================
# 301 redirects — ONE block for every redirect domain.
#
# To add a redirect: add a line to the $redirect_target map and put the
# domain on the server_name list below (scripts/new-site.sh does this).
# The value can contain variables, e.g. https://target.example$request_uri.
# =============================================================================

map $http_host $redirect_target {
	hostnames;
	default "";
	www.kartastrophecup.de   https://kartastrophecup.de$request_uri;
	www.spam-destroy.com     https://spam-destroy.com$request_uri;
	www.instant-attend.com   https://instant-attend.com$request_uri;
	www.kartastrophe.de      https://kartastrophe.de$request_uri;
	events.hellyer.kiwi      https://instantattend.com$request_uri;
	spamannihilator.com      https://spam-destroyer.com$request_uri;
	hellyer.kiwi             https://ryan.hellyer.kiwi$request_uri;
	geek.hellyer.kiwi        https://ryan.hellyer.kiwi$request_uri;
	random.hellyer.kiwi      https://ryan.hellyer.kiwi$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		www.kartastrophecup.de www.spam-destroy.com www.instant-attend.com www.kartastrophe.de
		events.hellyer.kiwi spamannihilator.com hellyer.kiwi geek.hellyer.kiwi random.hellyer.kiwi
		# >>> new-site.sh: add redirect domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	include /etc/nginx/snippets/security-headers.conf;

	# Only reached by the domains in the map above.
	if ($redirect_target) {
		return 301 $redirect_target;
	}
}