# =============================================================================
# stats.hellyer.kiwi — self-hosted GoatCounter (one vhost for EVERY site).
#
# Every domain in stats-domain-list.txt reports to this one host using:
#
#   <script>window.goatcounter = { path: function(p){ return location.host + p } }</script>
#   <script data-goatcounter="https://stats.hellyer.kiwi/count"
#           async src="https://stats.hellyer.kiwi/count.js"></script>
#
# GoatCounter deliberately does NOT record the domain, so the `path` override
# above prefixes it — all domains land in a single dashboard, filterable by
# host. That is the whole point of "Option A": no per-site stats subdomain and
# no wildcard certificate needed.
#
# Proxied to the `goatcounter` container (compose.yaml) on the `web` network.
# The target is a VARIABLE ($goatcounter_upstream), so nginx resolves it at
# request time via the http-level resolver and still starts if the container is
# down/missing — a static upstream name would make nginx fail to boot.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name stats.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	set $goatcounter_upstream "goatcounter:8080";

	client_max_body_size 10m;

	access_log /var/log/nginx/stats-site.access.log;
	error_log /var/log/nginx/stats-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		proxy_pass http://$goatcounter_upstream;
		proxy_http_version 1.1;

		# Pass the real client IP/scheme through, otherwise GoatCounter records
		# every pageview as coming from the nginx container (and GeoIP breaks).
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
