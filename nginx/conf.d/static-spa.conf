# =============================================================================
# Static single-page apps — ONE server block for comicjet.com and
# historic-wordpress.hellyer.kiwi.
#
# Files with an extension are served directly; every other path loads the
# index.html app shell.
# =============================================================================

map $http_host $spa_root {
	hostnames;
	comicjet.com /var/www/comicjet.com/public_html;
	historic-wordpress.hellyer.kiwi /var/www/historic-wordpress.hellyer.kiwi/public_html;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		comicjet.com historic-wordpress.hellyer.kiwi
		# >>> new-site.sh: add static-spa domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root $spa_root;
	index index.html;

	access_log /var/log/nginx/static-spa.access.log;
	error_log /var/log/nginx/static-spa.error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	# Files with an extension are served directly.
	location ~* \..+$ {
		try_files $uri =404;
	}

	# Everything else loads the app shell.
	location / {
		try_files /index.html =404;
	}
}