# =============================================================================
# storage.hellyer.kiwi — static file site behind Authelia.
#
# Same shape as stuff.hellyer.kiwi (autoindex + public), but its own block so it
# can be protected by Authelia (auth_request isn't variable-driven, so it can't
# share the static-site block with unprotected hosts).
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name storage.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/storage.hellyer.kiwi/public;
	index index.html index.php;
	autoindex on;

	access_log /var/log/sites/storage.hellyer.kiwi/access.log;
	error_log /var/log/sites/storage.hellyer.kiwi/error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	# Authelia forward-auth gate (whole vhost).
	include /etc/nginx/snippets/authelia-authz-location.conf;
	include /etc/nginx/snippets/authelia-authrequest.conf;

	# ---- static assets: cache for a year ----
	include /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files $uri $uri/ =404;
	}
}
