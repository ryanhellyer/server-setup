location ~* \.(css|avif|js|json|jpeg|jpg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|pdf|zip)$ {
    try_files $uri /index.php?$args;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    log_not_found off;

    # Re-apply security headers for this location
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Xss-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";
}

# Separate block for Markdown to force browser rendering
location ~* \.md$ {
	# necessary to override default MD type behaviour
	types { }

    default_type text/plain;
    charset utf-8;
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Xss-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";
}
