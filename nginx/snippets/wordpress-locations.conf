# Locations shared by the WordPress Multisite vhost (pressabl).
# Change once -> updates the multisite block.

# Test page (temporary).
location = /sitestashertest {
    try_files /sitestashertest/index.html =404;
}

# Multisite uploaded files ($blogid is set by the $blogid map in nginx.conf).
location ~ ^/files/(.*)$ {
    try_files /wp-content/blogs.dir/$blogid/$uri /wp-includes/ms-files.php?file=$1;
    access_log off;
    log_not_found off;
    expires max;
}

# Block direct access to the raw blogs.dir directory.
location ~* /wp-content/blogs.dir/ {
    return 403;
}

# Route .git access to WordPress (serves a proper 404).
location ~ /\.git {
    rewrite ^ /index.php?$args;
}