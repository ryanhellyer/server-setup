# GoatCounter upstream proxy settings — included by every location in
# nginx/conf.d/stats-site.conf so the catch-all and the cached /count.js
# location stay in sync.
#
# Uses the variable $goatcounter_upstream (set in the server block) so nginx
# resolves the container at request time via the http-level resolver and still
# starts if goatcounter is down/missing.
proxy_pass http://$goatcounter_upstream;
proxy_http_version 1.1;

# Pass the real client IP/scheme through, otherwise GoatCounter records every
# pageview as coming from the nginx container (and GeoIP breaks).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
