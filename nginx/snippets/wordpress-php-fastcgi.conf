# =============================================================================
# FastCGI PHP + shared cache settings for WordPress.
#
# Include INSIDE a location (never at server level). It is the same PHP and
# cache configuration the generic `location ~ \.php$` uses, so gated and
# ungated PHP behave identically — only the Authelia gate differs.
#
# $no_cache_final is built in nginx.conf from $no_cache_uri (which already
# covers /wp-admin/, /xmlrpc.php and /wp-*.php) plus the logged-in cookies, so
# admin/logged-in responses are never served from the shared FastCGI cache.
# =============================================================================

include /etc/nginx/snippets/fastcgi-php.conf;
fastcgi_pass php-fpm;

fastcgi_cache_bypass $no_cache_final;
fastcgi_no_cache     $no_cache_final;
fastcgi_cache PRESSABL;
fastcgi_cache_valid 200 1m;
fastcgi_cache_use_stale error timeout invalid_header http_500;
