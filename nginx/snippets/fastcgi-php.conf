# FastCGI PHP handling shared by EVERY PHP site (WordPress, Laravel, plain PHP).
# Change once -> updates every site that includes this snippet.
#
# Each vhost adds, after including this:
#   fastcgi_pass php-fpm;
#   fastcgi_cache_bypass / fastcgi_no_cache / fastcgi_cache ... (cache config)

fastcgi_split_path_info ^(.+\.php)(/.+)$;
try_files $uri =404;
fastcgi_index index.php;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

# Ignore PHP's own Cache-Control/Expires/Set-Cookie so the nginx cache wins.
fastcgi_ignore_headers Cache-Control Expires Set-Cookie;