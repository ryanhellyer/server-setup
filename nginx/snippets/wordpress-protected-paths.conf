# =============================================================================
# Internal WordPress endpoints gated by Authelia.
#
# Include ONCE per WordPress server block, directly after
# wordpress-locations.conf and BEFORE static-assets.conf and the generic
# `location ~ \.php$`. Ordering is load-bearing: nginx picks the first matching
# regex location, so the admin PHP regex below must be declared before the
# generic PHP handler and before the static-asset regexes. Requires
# authelia-authz-location.conf at server level (included once).
#
# auth_request is NOT variable-driven: these locations gate the listed paths
# for EVERY host in the block. For the pressabl multisite that is deliberate —
# all of its hosts want the same gate (WORDPRESS_SECURE.md §4.1).
#
# Deliberately NOT in here:
#   * wp-cron.php — hard-denied in the vhost (§4.6). Never gate cron: an
#     Authelia rule would *permit* it over HTTP to any authenticated session.
#   * admin-ajax.php — gated by the admin PHP regex below, with no exemption.
#     No site on this multisite uses it for logged-out AJAX (§4.2).
# =============================================================================

# ---- Login / multisite signup / activation ----
location = /wp-login.php {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	include /etc/nginx/snippets/wordpress-php-fastcgi.conf;
}

location = /wp-signup.php {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	include /etc/nginx/snippets/wordpress-php-fastcgi.conf;
}

location = /wp-activate.php {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	include /etc/nginx/snippets/wordpress-php-fastcgi.conf;
}

# ---- XML-RPC ----
location = /xmlrpc.php {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	include /etc/nginx/snippets/wordpress-php-fastcgi.conf;
}

# ---- Admin PHP (admin-ajax.php included). MUST come before `~ ^/wp-admin/`
#      and before the generic `location ~ \.php$`. ----
location ~ ^/wp-admin/.*\.php$ {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	include /etc/nginx/snippets/wordpress-php-fastcgi.conf;
}

# ---- Admin area (directory index + anything without a static extension).
#      Plain prefix, NOT `^~`: a `^~` prefix would outrank the PHP regex above
#      and make nginx serve wp-admin PHP as static text. ----
location /wp-admin/ {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	try_files $uri $uri/ /index.php?$args;
}

# ---- REST API. `^~` so the static-asset regexes cannot intercept it, and so
#      it cannot fall through to the ungated generic PHP handler. Anything
#      under /wp-json is routed to index.php below. ----
location ^~ /wp-json {
	include /etc/nginx/snippets/authelia-authrequest.conf;
	try_files $uri $uri/ /index.php?$args;
}
