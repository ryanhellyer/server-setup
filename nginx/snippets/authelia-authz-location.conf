# =============================================================================
# Authelia authz endpoint — include ONCE per server block that protects hosts.
#
# Defines the `internal` location nginx subrequests for every authorization
# check. The upstream is a VARIABLE resolved at request time via the http-level
# resolver (snippets/ssl-params.conf), so nginx still boots if the authelia
# container is down or missing — a static proxy_pass name would make nginx
# crash-loop.
#
# Pair this with snippets/authelia-authrequest.conf, which can be included at
# the server level (protect the whole vhost) or inside a single location
# (protect one path/page).
# =============================================================================

set $upstream_authelia "http://authelia:9091/api/authz/auth-request";

location /internal/authelia/authz {
	internal;

	proxy_pass $upstream_authelia;
	proxy_pass_request_body off;

	# The X-Original-* headers are the AuthRequest metadata Authelia requires.
	proxy_set_header Content-Length "";
	proxy_set_header Connection "";
	proxy_set_header X-Original-Method $request_method;
	proxy_set_header X-Original-URL $scheme://$host$request_uri;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Uri $request_uri;
	proxy_set_header X-Forwarded-Method $request_method;

	proxy_http_version 1.1;
	proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
	proxy_redirect http:// $scheme://;
	proxy_buffers 4 32k;
	client_body_buffer_size 128k;
	send_timeout 5m;
	proxy_read_timeout 240;
	proxy_send_timeout 240;
	proxy_connect_timeout 240;
}
