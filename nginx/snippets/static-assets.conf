# Static asset caching + security headers, shared by every PHP/static vhost.
# Change once -> updates every site.
#
# try_files falls back to the front controller to preserve the original
# behaviour (some sites generate assets on the fly).

# Images, fonts, CSS/JS: cache for a year, don't log misses.
location ~* \.(css|avif|js|json|jpeg|jpg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|pdf|zip)$ {
    try_files $uri /index.php?$args;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    log_not_found off;

    include /etc/nginx/snippets/security-headers.conf;
}

# Markdown: force browser rendering as plain text (no download).
location ~* \.md$ {
    types { }
    default_type text/plain;
    charset utf-8;

    expires 1y;
    add_header Cache-Control "public, immutable";

    include /etc/nginx/snippets/security-headers.conf;
}