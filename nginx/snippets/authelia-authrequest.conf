# =============================================================================
# Authelia forward-auth request.
#
# Include at the SERVER level to protect a whole vhost, or inside a single
# LOCATION to protect one path/page. Requires snippets/authelia-authz-location.conf
# to be included once in the same server block.
#
# nginx asks Authelia about each request. If Authelia says 401 (not logged in)
# the browser is redirected to the login portal with the original URL in ?rd=,
# and sent back here afterwards. Authelia returns the authenticated identity in
# Remote-User / Remote-Groups / Remote-Email headers, captured below so a
# backend can read them via $authelia_remote_* if it wants SSO.
#
# Known-user/group headers from Authelia are exposed to the proxied app; the
# session cookie is scoped to hellyer.kiwi (authelia/configuration.yml), which
# is what lets the portal at auth.hellyer.kiwi authorise chat.hellyer.kiwi.
# =============================================================================

auth_request /internal/authelia/authz;

auth_request_set $authelia_remote_user   $upstream_http_remote_user;
auth_request_set $authelia_remote_groups $upstream_http_remote_groups;
auth_request_set $authelia_remote_email  $upstream_http_remote_email;

auth_request_set $authelia_redirect $scheme://$http_host$request_uri;

# Not authenticated -> bounce to the portal, remembering where they were going.
error_page 401 =302 https://auth.hellyer.kiwi/?rd=$authelia_redirect;
