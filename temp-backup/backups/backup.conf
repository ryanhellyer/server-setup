# This file contains configuration variables for the backup scripts.
# Secrets are sourced from secrets.env (gitignored) in this same directory.

source "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")/secrets.env"

# --- Database Configuration ---
MYSQL_USER="ryan"
MYSQL_PASS="$MYSQL_PASS"
BACKUP_DIR="/var/www/backups/databases"

# Space-separated list of database names to backup
DB_NAMES="pressabl events secure cvs_hellyer_kiwi spamannihilator cvs_hellyer_kiwi kartastrophecup"

# Day of the week when the database dump should occur
# 1=Monday, 2=Tuesday, ..., 7=Sunday
WEEKLY_BACKUP_DAY=1

# --- Remote Sync Configuration (Hetzner) ---
HETZNER_USER="u458814"
HETZNER_HOST="u458814.your-storagebox.de"
HETZNER_SECONDARY_USER="u513410"
HETZNER_SECONDARY_HOST="u513410.your-storagebox.de"
SSH_PORT="23"
HETZNER_PATH="/home/var/www/"

# Exclude list for the main rsync operation
RSYNC_EXCLUDE='laravel-ryan.hellyer.kiwi/storage/'
