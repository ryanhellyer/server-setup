# Shared Valkey (a drop-in Redis replacement) for WP object cache + Laravel
# sessions/cache. Valkey speaks the same RESP protocol as Redis, so existing
# plugins (e.g. WP Redis object cache) and Laravel's cache/session drivers keep
# working unchanged — the container is reachable at both `valkey` and `redis`.
#
# Test server default is 64 MB (only 2 GB RAM). On production raise it via
# VALKEY_MAXMEMORY in .env (compose passes it as --maxmemory, overriding this).
maxmemory 64mb
maxmemory-policy allkeys-lru

# No persistence needed (it's a cache — the DB is the source of truth).
save ""
appendonly no
