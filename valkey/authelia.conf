# =============================================================================
# Dedicated Authelia session store (compose service: authelia-valkey).
#
# This is NOT the shared cache — see valkey.conf for that one. Only Authelia's
# `authelia-session:*` keys live here, so nothing else can evict or flush a
# login.
#
# The settings below are the opposite of the cache on purpose:
#
# * AOF persistence. Sessions are not disposable cache entries: without this a
#   container recreate (every scripts/update.sh run), a `podman restart` or a
#   reboot starts empty and every browser has to log in again. `appendfsync
#   everysec` loses at most ~1 second of last-activity updates on a hard kill,
#   never a whole session.
# * `save 60 1` adds an RDB snapshot as a second copy (and makes restarts fast).
# * `dir /data` is the named volume `authelia-valkey-data`; it outlives the
#   container. `compose down -v` / `podman volume prune` still deletes it.
#
# maxmemory is overridden by compose from AUTHELIA_VALKEY_MAXMEMORY (.env), the
# same way VALKEY_MAXMEMORY drives the cache. It is a cap, not a reservation:
# idle usage is roughly 1 KB per session.
#
# maxmemory-policy allkeys-lru is a safety valve, NOT the normal path. Authelia
# 4.39 (verified on 4.39.28) writes one session for every UNAUTHENTICATED authz
# request — mostly bot traffic on wp-json/wp-login across the multisite hosts —
# and those keys are never read again. With a 30-day TTL the steady state is
# large. Under pressure LRU drops those cold, never-reused sessions first while
# keeping the sessions that are touched on every request.
#
# Do NOT switch this to `noeviction` while that traffic exists: a full instance
# would reject session writes and nobody could log in. Do NOT move these keys
# onto the shared `valkey` cache either — it has no persistence and evicts.
# =============================================================================

appendonly yes
appendfsync everysec
save 60 1
dir /data

maxmemory 1gb
maxmemory-policy allkeys-lru
