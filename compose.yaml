# Root Compose file — full hellyer.kiwi stack.
# Orchestration:  sudo podman compose up -d --build
# (podman-compose also works for older setups.)

services:
  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/modules-enabled:/etc/nginx/modules-enabled:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
      - ./nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
      - ./nginx/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./env/letsencrypt:/etc/letsencrypt:ro
      - php-socket:/run/php:ro
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
      - ${LOG_ROOT:-/home/ryan/logs}:/var/log/sites
      - /var/log/nginx:/var/log/nginx
      - /var/cache/nginx:/var/cache/nginx
    depends_on:
      - php
      - node
      - open-webui
      - goatcounter
      - authelia
    networks: [web]
    restart: unless-stopped

  php:
    build: ./php
    container_name: php-fpm
    volumes:
      - ./php/10-opcache.ini:/etc/php/8.5/fpm/conf.d/10-opcache.ini:ro
      - ./php/20-fpm-security.ini:/etc/php/8.5/fpm/conf.d/20-fpm-security.ini:ro
      - ./php/fpm-www.conf:/etc/php/8.5/fpm/pool.d/www.conf:ro
      - php-socket:/run/php
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
      # Phone-sync content (sshfs mount of u676107), read-only for the Laravel
      # app at /var/phone-files. Written by the `syncthing` container.
      - ${PHONE_FILES_ROOT:-/home/ryan/phone-files}:/var/phone-files:ro
      # Per-site logs (~/logs) — same host dir nginx mounts, so application
      # logs are kept OUTSIDE the web roots and never land in a site
      # backup/snapshot. Point Laravel LOG_PATH / WP_DEBUG_LOG / PHP error_log
      # at /var/log/sites/<site>/ inside the containers.
      - ${LOG_ROOT:-/home/ryan/logs}:/var/log/sites
    networks: [web, backend]
    restart: unless-stopped

  node:
    build: ./node
    container_name: node
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
    networks: [web]
    restart: unless-stopped

  # Open WebUI (chat.hellyer.kiwi) — its own container, proxied by nginx.
  # The host data dir IS the container's /app/backend/data (SQLite + uploads).
  # scripts/provision-openwebui.sh restores it from the Hetzner snapshot.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      WEBUI_URL: ${OPENWEBUI_URL:-https://chat.hellyer.kiwi}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}/chat.hellyer.kiwi:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"   # localhost only; nginx proxies via the web network
    networks: [web]
    # Restarted by compose (`restart: unless-stopped`) like the rest of the
    # stack. The CPU/memory limits below stop a crash-looping app — e.g. a
    # corrupt SQLite DB — from starving the rest of the stack.
    #
    # Healthcheck: Open WebUI has hung during startup before (the process keeps
    # listening but never answers). `restart: unless-stopped` does NOT act on a
    # hung-but-running container, so this check exists purely to SURFACE the
    # problem: `podman ps` shows "(unhealthy)" and `podman inspect open-webui`
    # carries the verdict, so the failure is visible instead of a silent hang.
    # Recovery is manual: `sudo systemctl restart server-stack.service`
    # (recreates the container inside the stack's persistent cgroup — do NOT
    # `podman restart` from a transient session/timer cgroup; systemd reaps that
    # cgroup and SIGKILLs the container's conmon).
    # curl is present in the image; /health returns {"status":true}.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m

  # GoatCounter (stats.hellyer.kiwi) — self-hosted, privacy-friendly web
  # analytics for every domain in stats-domain-list.txt. A single Go binary +
  # SQLite (no separate database), proxied by nginx (nginx/conf.d/stats-site.conf).
  # Its data lives under ~/www so the nightly backup snapshots it like a site.
  #
  # Runs as root (`user: "0:0"`): the image's own `goatcounter` user (Alpine uid
  # 1000) would fight the ~/www ownership model (files are ryan:www-data, reset
  # by fix-perms.sh), whereas root can always write into that tree — the same
  # approach as the open-webui data dir.
  goatcounter:
    image: docker.io/arp242/goatcounter:2.7
    container_name: goatcounter
    user: "0:0"
    environment:
      GOATCOUNTER_LISTEN: ":8080"
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}/stats.hellyer.kiwi:/home/goatcounter/goatcounter-data
    networks: [web]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Syncthing (phone.hellyer.kiwi) — syncs the phone into an sshfs mount of
  # u676107:/home/phone-files. That mount lives at $PHONE_FILES_ROOT on the
  # host (outside ~/www), which the php-fpm container also mounts read-only at
  # /var/phone-files for the Laravel app. The mount is set up by
  # scripts/storage-mounts.sh; the folder itself is added once through the GUI
  # (published on 127.0.0.1 only — reach it via an SSH tunnel:
  #   ssh -L 8384:127.0.0.1:8384 ryan@<host>   then open http://127.0.0.1:8384
  # ). Config + index DB live under ~/www so the nightly backup snapshots them.
  #
  # Runs as PUID/PGID (default 1000:1000 — the `ryan` account the sshfs mount
  # is mapped to) so it can write into the mount; UMASK=002 keeps files
  # group/other-readable for php-fpm (www-data). Published ports: 22000 tcp/udp
  # (file transfer) + 21027/udp (local discovery) — opened in the firewall by
  # scripts/deploy.sh. A container network is used rather than host mode, which
  # is why local discovery is published; global discovery/relaying still works.
  syncthing:
    image: docker.io/syncthing/syncthing:2.1.6
    container_name: syncthing
    hostname: phone-hellyer-kiwi
    environment:
      PUID: ${SYNCTHING_PUID:-1000}
      PGID: ${SYNCTHING_PGID:-1000}
      UMASK: "002"
      STGUIADDRESS: "0.0.0.0:8384"
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}/phone.hellyer.kiwi/.syncthing:/var/syncthing
      - ${PHONE_FILES_ROOT:-/home/ryan/phone-files}:/var/sync/files
    ports:
      - "127.0.0.1:8384:8384"   # web UI — localhost only (SSH-tunnel to it)
      - "22000:22000/tcp"       # TCP file transfers
      - "22000:22000/udp"       # QUIC file transfers
      - "21027:21027/udp"       # local discovery broadcasts
    networks: [web]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # Authelia (auth.hellyer.kiwi) — forward-auth / SSO gate in front of
  # protected vhosts (chat.hellyer.kiwi today). nginx calls it per-request via
  # auth_request (see nginx/snippets/authelia-*.conf); the login portal lives
  # on its own vhost (nginx/conf.d/auth-site.conf).
  #
  # Storage is a local SQLite DB under ~/www/auth.hellyer.kiwi (the same model
  # as goatcounter): it sits under the web root so the nightly backup snapshots
  # it like a site, and it needs no separate database container. Sessions live
  # in the existing valkey container. Runs as root (`user: "0:0"`) so writes
  # into the ryan:www-data tree (reset by fix-perms.sh) never fail.
  #
  # NOTE: this data dir is bind-mounted for the container; the portal itself is
  # a proxy vhost (nginx/conf.d/auth-site.conf) and has no nginx `root` under
  # ~/www. So there is a ~/www/auth.hellyer.kiwi DATA dir but no site root.
  #
  # Secrets are passed as AUTHELIA_* env vars (Authelia maps those to config);
  # do NOT pass the whole .env via env_file, because every AUTHELIA_* var is
  # parsed as configuration (an unrelated AUTHELIA_URL would be rejected).
  authelia:
    image: docker.io/authelia/authelia:4.39
    container_name: authelia
    user: "0:0"
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:-}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:-}
      AUTHELIA_SESSION_REDIS_HOST: valkey
      AUTHELIA_SESSION_REDIS_PORT: "6379"
    volumes:
      - ./authelia:/config:ro
      - ${WWW_ROOT:-/home/ryan/www}/auth.hellyer.kiwi:/data
    # Give the SMTP notifier a relay to talk to on first boot. compose only
    # orders startup; authelia's own `restart: unless-stopped` covers the race.
    depends_on:
      - mailrelay
    networks: [web, backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # mailrelay — catch-all SMTP sink that forwards every message to Telegram
  # (EMAILS.md). One destination for WordPress/Laravel PHP mail (via the msmtp
  # sendmail shim in the php image), Authelia's SMTP notifier, the host's
  # cron/fail2ban/unattended-upgrades (via the published localhost port), and
  # any future app that speaks SMTP.
  #
  # IMPORTANT: this is on the `web` network, NOT the internal `backend` one —
  # it needs outbound internet to reach api.telegram.org, and `backend` is
  # `internal: true` (no egress). The port is bound to 127.0.0.1 only, so it is
  # never exposed publicly; containers reach it by the name `mailrelay`.
  mailrelay:
    build: ./mail
    container_name: mailrelay
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MAIL_TELEGRAM_MODE: ${MAIL_TELEGRAM_MODE:-all}
      MAIL_LOCAL_DOMAINS: ${MAIL_LOCAL_DOMAINS:-hellyer.kiwi,localhost,localhost.localdomain}
      MAIL_DENY_REGEX: ${MAIL_DENY_REGEX:-}
      MAIL_ALLOW_REGEX: ${MAIL_ALLOW_REGEX:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-server@hellyer.kiwi}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-12}
      MAIL_SPOOL_DIR: /var/spool/mailrelay
      TZ: ${TZ:-Europe/London}
    volumes:
      - mailrelay-spool:/var/spool/mailrelay
    ports:
      - "127.0.0.1:2525:25"   # host services (cron/fail2ban/...) only
    networks: [web]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mariadb:
    image: docker.io/mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - /var/lib/mysql:/var/lib/mysql
      - ./maria/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks: [backend]
    restart: unless-stopped

  # Valkey is a drop-in, RESP-compatible fork of Redis. It keeps the `redis`
  # network alias so existing WP/Laravel cache configs (which use host `redis`)
  # keep working unchanged; new configs can use `valkey`.
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: valkey
    command: ["valkey-server", "/etc/valkey/valkey.conf", "--maxmemory", "${VALKEY_MAXMEMORY:-64mb}"]
    environment:
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-64mb}
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    networks:
      backend:
        aliases:
          - redis
    restart: unless-stopped

volumes:
  php-socket:
  # Persisted mailrelay spool: messages that have been accepted but not yet
  # forwarded to Telegram survive a container restart/crash.
  mailrelay-spool:

networks:
  web:
  backend:
    internal: true