# Root Compose file — full hellyer.kiwi stack.
# Orchestration:  sudo podman compose up -d --build
# (podman-compose also works for older setups.)

services:
  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/modules-enabled:/etc/nginx/modules-enabled:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
      - ./nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
      - ./nginx/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./env/letsencrypt:/etc/letsencrypt:ro
      - php-socket:/run/php:ro
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
      - ${LOG_ROOT:-/home/ryan/logs}:/var/log/sites
      - /var/log/nginx:/var/log/nginx
      - /var/cache/nginx:/var/cache/nginx
    depends_on:
      - php
      - node
      - open-webui
      - goatcounter
    networks: [web]
    restart: unless-stopped

  php:
    build: ./php
    container_name: php-fpm
    volumes:
      - ./php/10-opcache.ini:/etc/php/8.5/fpm/conf.d/10-opcache.ini:ro
      - ./php/20-fpm-security.ini:/etc/php/8.5/fpm/conf.d/20-fpm-security.ini:ro
      - ./php/fpm-www.conf:/etc/php/8.5/fpm/pool.d/www.conf:ro
      - php-socket:/run/php
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
      # Per-site logs (~/logs) — same host dir nginx mounts, so application
      # logs are kept OUTSIDE the web roots and never land in a site
      # backup/snapshot. Point Laravel LOG_PATH / WP_DEBUG_LOG / PHP error_log
      # at /var/log/sites/<site>/ inside the containers.
      - ${LOG_ROOT:-/home/ryan/logs}:/var/log/sites
    networks: [web, backend]
    restart: unless-stopped

  node:
    build: ./node
    container_name: node
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}:/var/www
    networks: [web]
    restart: unless-stopped

  # Open WebUI (chat.hellyer.kiwi) — its own container, proxied by nginx.
  # The host data dir IS the container's /app/backend/data (SQLite + uploads).
  # scripts/provision-openwebui.sh restores it from the Hetzner snapshot.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      WEBUI_URL: ${OPENWEBUI_URL:-https://chat.hellyer.kiwi}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}/chat.hellyer.kiwi:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"   # localhost only; nginx proxies via the web network
    networks: [web]
    # Restarted by compose (`restart: unless-stopped`) like the rest of the
    # stack. The CPU/memory limits below stop a crash-looping app — e.g. a
    # corrupt SQLite DB — from starving the rest of the stack.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m

  # GoatCounter (stats.hellyer.kiwi) — self-hosted, privacy-friendly web
  # analytics for every domain in stats-domain-list.txt. A single Go binary +
  # SQLite (no separate database), proxied by nginx (nginx/conf.d/stats-site.conf).
  # Its data lives under ~/www so the nightly backup snapshots it like a site.
  #
  # Runs as root (`user: "0:0"`): the image's own `goatcounter` user (Alpine uid
  # 1000) would fight the ~/www ownership model (files are ryan:www-data, reset
  # by fix-perms.sh), whereas root can always write into that tree — the same
  # approach as the open-webui data dir.
  goatcounter:
    image: docker.io/arp242/goatcounter:2.7
    container_name: goatcounter
    user: "0:0"
    environment:
      GOATCOUNTER_LISTEN: ":8080"
    volumes:
      - ${WWW_ROOT:-/home/ryan/www}/stats.hellyer.kiwi:/home/goatcounter/goatcounter-data
    networks: [web]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mariadb:
    image: docker.io/mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - /var/lib/mysql:/var/lib/mysql
      - ./maria/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks: [backend]
    restart: unless-stopped

  # Valkey is a drop-in, RESP-compatible fork of Redis. It keeps the `redis`
  # network alias so existing WP/Laravel cache configs (which use host `redis`)
  # keep working unchanged; new configs can use `valkey`.
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: valkey
    command: ["valkey-server", "/etc/valkey/valkey.conf", "--maxmemory", "${VALKEY_MAXMEMORY:-64mb}"]
    environment:
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-64mb}
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    networks:
      backend:
        aliases:
          - redis
    restart: unless-stopped

volumes:
  php-socket:

networks:
  web:
  backend:
    internal: true